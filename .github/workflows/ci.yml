name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run tests
      run: |
        python3 -m pytest tests/ -v --tb=short --strict-markers
        # Check that we didn't skip all tests
        test_output=$(python3 -m pytest tests/ -v --tb=short 2>&1)
        echo "$test_output"
        if echo "$test_output" | grep -q "100% skipped"; then
          echo "ERROR: All tests were skipped. Set THOMPSON_SSD_PATH or add more non-SSD tests."
          exit 1
        fi
      env:
        THOMPSON_SSD_PATH: ${{ secrets.THOMPSON_SSD_PATH }}
