name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run tests (mock SSD path)
      run: |
        # Note: Tests that require SSD files are skipped.
        # To run full tests, provide SSD file path via environment variable:
        # SSD_PATH=/path/to/Computer_Concepts_Chess_DThompson.ssd pytest tests/ -v
        python3 -m pytest tests/ -v -k "not (test_load_board_data or test_bitboard_tables or test_choose_move or test_evidence or test_starting or test_white or test_choose_move_starting or test_get_candidates or test_validate or test_candidates_n or test_validate_legal or test_evidence_contains)"
      env:
        SSD_PATH: ${{ secrets.SSD_PATH }}
